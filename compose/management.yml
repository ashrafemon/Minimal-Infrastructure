services:
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: minimal-infrastructure-phpmyadmin-1
    environment:
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=300M
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 3456:80
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4
    container_name: minimal-infrastructure-pgadmin-1
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.25"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    secrets:
      - pgadmin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: minimal-infrastructure-arcane-1
    ports:
      - "3552:3552"
    environment:
      - APP_URL=http://localhost:3552
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY_FILE=/run/secrets/arcane_encryption_key
      - JWT_SECRET_FILE=/run/secrets/arcane_jwt_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
    secrets:
      - arcane_encryption_key
      - arcane_jwt_secret
    networks:
      - app_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
