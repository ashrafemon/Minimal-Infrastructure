services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: always
    command:
      - /bin/sh
      - -c
      - 'export RABBITMQ_DEFAULT_USER=$$(cat /run/secrets/rabbitmq_user); export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/rabbitmq_password); exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server'
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
